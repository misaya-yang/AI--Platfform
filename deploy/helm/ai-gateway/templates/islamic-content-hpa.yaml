{{- if and .Values.islamicContent.enabled .Values.islamicContent.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "ai-gateway.fullname" . }}-islamic-content
  labels:
    {{- include "ai-gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: islamic-content
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "ai-gateway.fullname" . }}-islamic-content
  minReplicas: {{ .Values.islamicContent.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.islamicContent.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.islamicContent.autoscaling.targetCPUUtilization }}
{{- end }}
