{{- if .Values.islamicContent.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ai-gateway.fullname" . }}-islamic-content
  labels:
    {{- include "ai-gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: islamic-content
spec:
  {{- if not .Values.islamicContent.autoscaling.enabled }}
  replicas: {{ .Values.islamicContent.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "ai-gateway.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: islamic-content
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        {{- include "ai-gateway.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: islamic-content
    spec:
      containers:
        - name: islamic-content
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.islamicContent.image.repository }}:{{ .Values.islamicContent.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8091
              protocol: TCP
          env:
            {{- range $key, $value := .Values.islamicContent.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "ai-gateway.fullname" . }}-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "ai-gateway.fullname" . }}-secret
                  key: POSTGRES_PASSWORD
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "ai-gateway.fullname" . }}-secret
                  key: REDIS_PASSWORD
            - name: ISLAMIC_CONTENT_DATABASE__DSN
              value: {{ include "ai-gateway.postgresDSN" . | quote }}
            - name: ISLAMIC_CONTENT_CACHE__REDIS_URL
              value: {{ include "ai-gateway.redisURLDB1" . | quote }}
          livenessProbe:
            httpGet:
              path: /health
              port: 8091
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8091
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.islamicContent.resources | nindent 12 }}
{{- end }}
