{{- if .Values.islamicContent.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ai-gateway.fullname" . }}-islamic-content
  labels:
    {{- include "ai-gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: islamic-content
spec:
  type: ClusterIP
  ports:
    - port: 8091
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "ai-gateway.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: islamic-content
{{- end }}
