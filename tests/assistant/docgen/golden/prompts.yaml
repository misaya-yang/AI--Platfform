# 30 golden doc-gen prompts — covers every format × several scenario types.
#
# These are *deterministic* prompts: with no LLM configured the pipeline
# still produces a valid artifact via the markdown-to-IR fallback. The
# bar for Phase 3 is: >=95% pass rate after two fix-and-verify rounds.
#
# Fields:
#   id, doc_type, title, goal, body_markdown?
#
# Prompts 28-30 include the CJK canary string the plan mandates.

prompts:
  # -------------------- DOCX (8) --------------------
  - id: docx-q2-review
    doc_type: docx
    title: Q2-2026 RAG Architecture Review
    goal: Internal review report of the RAG stack
    body_markdown: |
      # Executive Summary
      Shipped hybrid BM25 + dense retrieval. Top-5 accuracy up 17 pp.

      # Findings
      - Citation integrity regressed 4 pp during 0408 merge; rolled back.
      - Canary prompts render with Noto CJK.

      # Plan
      1. Land vision critic loop
      2. Cut Phase 3

  - id: docx-security-memo
    doc_type: docx
    title: Security Memo 2026-04
    goal: Monthly security memo for engineering
    body_markdown: |
      # Overview
      No incidents this month; three dependency bumps.

      # Actions
      - Rotate signing keys on 2026-05-01.
      - Enable 2FA for all SaaS vendors.

  - id: docx-hiring-plan
    doc_type: docx
    title: Hiring Plan H2 2026
    goal: Headcount plan memo

  - id: docx-api-spec
