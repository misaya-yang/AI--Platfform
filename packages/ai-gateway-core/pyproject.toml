[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-gateway-core"
version = "0.1.0"
description = "Shared primitives (logging, exceptions, enums, protocols) consumed by ai-gateway and assistant-service."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Hejaz Engineering" }]
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["src/ai_gateway_core"]
