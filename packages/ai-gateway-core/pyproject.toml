[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-gateway-core"
version = "0.1.1"
description = "Shared primitives (logging, exceptions, enums, protocols, proxy framework) consumed by ai-gateway and assistant-service."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Hejaz Engineering" }]
# ``proxy`` submodule needs httpx + FastAPI; auth/gateway_secret is
# pure-stdlib. Callers typically already have these installed
# transitively, so no version pin — matches the host-service minimum.
dependencies = [
    "httpx",
    "fastapi",
    "starlette",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ai_gateway_core"]
