# Local / staging docker-compose for mcp-docgen-server.
#
# Usage (from repo root):
#   docker compose -f packages/mcp-docgen-server/deploy/docker-compose.yml up
#
# The server will be reachable at http://localhost:8765/mcp (SSE) and
# http://localhost:8765/health for healthchecks.

services:
  docgen:
    image: mcp-docgen:dev
    build:
      # Build context is the repo root so the Dockerfile's COPY paths
      # resolve correctly (`packages/mcp-docgen-server/...`).
      context: ../../..
      dockerfile: packages/mcp-docgen-server/Dockerfile
    container_name: mcp-docgen
    restart: unless-stopped
    ports:
      - "8765:8765"
    environment:
      MCP_TRANSPORT: sse
      PORT: "8765"
      LOG_LEVEL: INFO
      DOCGEN_ARTIFACT_ROOT: /var/lib/docgen/artifacts
      # Uncomment to enable the vision critic (requires API key):
      # ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    volumes:
      - docgen-artifacts:/var/lib/docgen/artifacts
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8765/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    # Resource limits — LibreOffice can spike during xlsx formula recalc.
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1536M
        reservations:
          cpus: "0.5"
          memory: 512M

volumes:
  docgen-artifacts:
    name: mcp-docgen-artifacts
