[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-docgen"
version = "0.1.0"
description = "Design-system-driven document generation (docx/pptx/xlsx/pdf) with pydantic IR + vision critic"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "AI Gateway Maintainers", email = "maintainers@example.com" }]
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7",
    "python-pptx>=0.6",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "reportlab>=4.0",
    "lxml>=5.0",
    "Pillow>=10.0",
    "httpx>=0.27",
    # ``docgen.skills.loader`` reads skill manifests (frontmatter YAML).
    # The original pyproject omitted PyYAML assuming it would arrive via
    # a transitive dep — it didn't, and the MCP server crashed on import
    # inside a fresh production image the first time we built it.
    "PyYAML>=6.0",
]

[project.optional-dependencies]
vision = ["anthropic>=0.40"]
# MCP server wrapper (packages/mcp-docgen-server/src/mcp_docgen_server/).
# MCP 2.x is the supported plugin transport line.
# Install with ``pip install -e ".[mcp]"`` to enable the stdio / HTTP server.
mcp = [
    "mcp>=2.0,<3",
    "starlette>=0.37",
    "uvicorn>=0.30",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "mcp>=2.0,<3",
    "starlette>=0.37",
    "uvicorn>=0.30",
]

[project.scripts]
mcp-docgen-server = "mcp_docgen_server.__main__:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Use importlib mode so tests/docgen/ does not shadow the installed `docgen` package
# on sys.path. With the default "prepend" mode, pytest adds tests/ to sys.path and
# the `docgen` test directory eclipses the real package.
addopts = "--import-mode=importlib"
