# Trusted local-development overlay for the Assistant code executor.
#
# This deliberately stays out of the default open-source quickstart: access to
# the Docker Engine is host-equivalent authority. Use the repository wrapper:
#
#   make code-executor-enable
#   make code-executor-test
#   make code-executor-disable

services:
  assistant-service:
    environment:
      ASSISTANT_CODE_EXECUTOR_ENABLED: "true"
      ASSISTANT_CODE_EXECUTOR_BACKEND: "${ASSISTANT_CODE_EXECUTOR_BACKEND:-docker}"
      ASSISTANT_ALLOW_RUNC_CODE_EXECUTOR: "true"
      SANDBOX_RUNTIME: "${SANDBOX_RUNTIME:-}"
      SANDBOX_WORKSPACE: "/opt/deploy/sandbox-workspace"
      SANDBOX_WORKSPACE_HOST: "${ASSISTANT_SANDBOX_WORKSPACE_HOST:?ASSISTANT_SANDBOX_WORKSPACE_HOST is required}"
      ASSISTANT_CODE_EXECUTOR_IMAGE: "${ASSISTANT_CODE_EXECUTOR_IMAGE:-ghcr.io/misaya-yang/ai-gateway-docgen-sandbox:2.0.0}"
      ASSISTANT_CODE_EXECUTOR_PYTHON: "${ASSISTANT_CODE_EXECUTOR_PYTHON:-python3}"
    group_add:
      - "${DOCKER_SOCKET_GID:?DOCKER_SOCKET_GID is required}"
    volumes:
      - "${ASSISTANT_CODE_EXECUTOR_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock"
      - "${ASSISTANT_SANDBOX_WORKSPACE_HOST}:/opt/deploy/sandbox-workspace"
