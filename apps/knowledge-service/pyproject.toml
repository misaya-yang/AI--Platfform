[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "knowledge-service"
version = "0.1.0"
description = "Knowledge Base Microservice - Independent KB service extracted from AI Gateway"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Hejaz Engineering" }]
dependencies = [
    "fastapi>=0.124.0",
    "uvicorn>=0.38.0",
    "pydantic>=2.12.0",
    "pydantic-settings>=2.12.0",
    "httpx>=0.28.0",
    "asyncpg>=0.31.0",
    "qdrant-client>=1.13.0",
    "sqlalchemy>=2.0.0",
    "python-multipart>=0.0.20",
    "pymupdf>=1.25.0",
    "boto3>=1.38.0",
    "aioboto3>=13.0.0",
    "structlog>=25.1.0",
    "orjson>=3.11.0",
    "python-dotenv>=1.2.0",
    "cachetools>=5.5.0",
    # sentence-transformers / paddleocr removed — embeddings use remote Gemini API,
    # OCR uses VLM service. Avoids pulling PyTorch (~2GB) into the image.
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
]

[project.scripts]
knowledge-service = "knowledge_service.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/knowledge_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
python_functions = ["test_*"]
