[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "islamic-content-service"
version = "0.1.0"
description = "Standalone Quran and Hadith content microservice"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Hejaz Engineering" }]
dependencies = [
    "fastapi>=0.124.0",
    "uvicorn>=0.38.0",
    "pydantic>=2.12.0",
    "pydantic-settings>=2.12.0",
    "httpx>=0.28.0",
    "asyncpg>=0.31.0",
    "redis>=7.1.0",
    "python-dotenv>=1.2.0",
    "orjson>=3.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
]

[project.scripts]
islamic-content-service = "islamic_content_service.main:main"
islamic-content-cli = "islamic_content_service.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/islamic_content_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
python_functions = ["test_*"]
markers = [
    "integration: tests that call real upstream services when credentials are provided",
]
