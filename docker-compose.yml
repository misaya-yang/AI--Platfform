# =============================================================================
# AI Gateway - Production Docker Compose
# =============================================================================
# Usage:
#   启动所有服务:  docker-compose up -d
#   仅启动基础设施: docker-compose up -d postgres redis qdrant
#   查看日志:       docker-compose logs -f gateway
#   停止所有服务:   docker-compose down
#   清理数据卷:     docker-compose down -v
# =============================================================================

services:
  # ===========================================================================
  # Infrastructure Services
  # ===========================================================================

  # PostgreSQL - Primary Database
  postgres:
    image: postgres:16-alpine
    container_name: ai-gateway-pg
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-gateway}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
      # Note: Database schema is auto-initialized by gateway service (AUTO_INIT=true)
      # Uncomment below if you have a custom schema.sql
      # - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    networks:
      - ai-gateway-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-gateway}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # Redis - Cache & Session Store
  redis:
    image: redis:7-alpine
    container_name: ai-gateway-redis
    environment:
      # Pass password to container for healthcheck access
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    networks:
      - ai-gateway-net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a '${REDIS_PASSWORD:?REDIS_PASSWORD is required}' ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Qdrant - Vector Database for Knowledge Base
  qdrant:
    image: qdrant/qdrant:v1.14.0
    container_name: ai-gateway-qdrant
    ports:
      - "127.0.0.1:${QDRANT_HTTP_PORT:-6333}:6333"
      - "127.0.0.1:${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - ai-gateway-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:6333/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # ===========================================================================
  # Migration Job (Phase 6) — opt-in
  # ===========================================================================
  # Phase-6 per-service schema split + future per-service migrations.
  # NOT in the default startup sequence: gateway's auto_init still handles
  # fresh installs the legacy way, and the schema split is a one-time
  # operator action against an existing prod DB. Run with:
  #
  #     docker compose run --rm migrate
  #
  # The job is idempotent (each SQL file recorded in
  # public.schema_migrations_meta) so repeated runs are safe no-ops.
  # When all data has been migrated and code uses fully-qualified table
  # names, gateway's GATEWAY_DATABASE__AUTO_INIT can be set to false and
  # this job becomes the only schema authority.
  migrate:
    build:
      context: .
      dockerfile: docker/migrate/Dockerfile
    image: ai-gateway-migrate:${TAG:-latest}
    container_name: ai-gateway-migrate
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-gateway}"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ai-gateway-net
    restart: "no"
    profiles:
      - migrate  # opt-in via `docker compose run --rm migrate`

  # ===========================================================================
  # Tracing Backend (Phase 6, local dev only)
  # ===========================================================================
  # Grafana Tempo single-binary mode. Apps export OTLP → tempo:4317; query
  # via http://localhost:3200. NOT included in prod compose unless the
  # operator opts in — prod sends to whatever OTLP endpoint
  # OTEL_EXPORTER_OTLP_ENDPOINT names.
  tempo:
    image: grafana/tempo:2.5.0
    container_name: ai-gateway-tempo
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./docker/tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "127.0.0.1:3200:3200"   # Tempo HTTP query
      - "127.0.0.1:4317:4317"   # OTLP gRPC ingest
    networks:
      - ai-gateway-net
    restart: unless-stopped
    profiles:
      - tracing  # opt-in: `docker compose --profile tracing up -d tempo`

  # ===========================================================================
  # Application Services
  # ===========================================================================

  # AI Gateway Backend
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-gateway:${TAG:-latest}
    container_name: ai-gateway-backend
    environment:
      # Server
      GATEWAY_HOST: "0.0.0.0"
      GATEWAY_PORT: "8080"
      GATEWAY_TASK_WORKER_CONCURRENCY: "${TASK_WORKER_CONCURRENCY:-2}"

      # Database
      GATEWAY_DATABASE__ENABLED: "true"
      GATEWAY_DATABASE__DSN: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-gateway}"
      GATEWAY_DATABASE__AUTO_INIT: "true"

      # Redis
      GATEWAY_REDIS__ENABLED: "true"
      GATEWAY_REDIS__URL: "redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0"

      # Authentication
      GATEWAY_AUTHENTICATION__JWT__ENABLED: "true"
      GATEWAY_AUTHENTICATION__JWT__SECRET: "${JWT_SECRET:?JWT_SECRET is required}"
      GATEWAY_AUTHENTICATION__JWT__ALGORITHMS: '["HS256"]'

      # LangGraph (optional)
      GATEWAY_LANGGRAPH__ENABLED: "${LANGGRAPH_ENABLED:-false}"
      GATEWAY_LANGGRAPH__INSTANCE_URLS: "${LANGGRAPH_INSTANCE_URLS:-}"
      GATEWAY_LANGGRAPH__AUTH_TOKEN: "${LANGGRAPH_AUTH_TOKEN:-}"

      # Knowledge Base
      GATEWAY_KNOWLEDGE__ENABLED: "true"
      GATEWAY_KNOWLEDGE__WORKER_CONCURRENCY: "${KNOWLEDGE_WORKER_CONCURRENCY:-2}"
      GATEWAY_KNOWLEDGE__QDRANT__ENABLED: "true"
      GATEWAY_KNOWLEDGE__QDRANT__URL: "http://qdrant:6333"

      # Embeddings API (DashScope / Gemini)
      GATEWAY_KNOWLEDGE__DASHSCOPE__API_KEY: "${DASHSCOPE_API_KEY:-}"

      # LLM provider keys (assistant chat path — loaded by _init_assistant_service
      # in main.py). Separate chat-specific overrides route chat to free Intl
      # endpoint without affecting image_gen / embedding.
      DASHSCOPE_API_KEY: "${DASHSCOPE_API_KEY:-}"
      DASHSCOPE_CHAT_API_KEY: "${DASHSCOPE_CHAT_API_KEY:-}"
      DASHSCOPE_CHAT_BASE_URL: "${DASHSCOPE_CHAT_BASE_URL:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GOOGLE_API_KEY: "${GOOGLE_API_KEY:-}"
      GOOGLE_API_BACKEND: "${GOOGLE_API_BACKEND:-}"
      VERTEX_API_KEY: "${VERTEX_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      TAVILY_API_KEY: "${TAVILY_API_KEY:-}"

      # Proxy
      GATEWAY_PROXY__ENABLED: "true"
      GATEWAY_PROXY__BILLING_ENABLED: "${PROXY_BILLING_ENABLED:-false}"

      # Shared HMAC for gateway → assistant-service (Phase 5a). Same
      # value must be set on the assistant-service block. Both sides
      # load it via env_file in prod.
      ASSISTANT_SERVICE_URL: "${ASSISTANT_SERVICE_URL:-http://assistant-service:8093}"
      GATEWAY_ASSISTANT_SHARED_SECRET: "${GATEWAY_ASSISTANT_SHARED_SECRET:?GATEWAY_ASSISTANT_SHARED_SECRET is required for gateway<->assistant-service auth}"

      # Object Storage (S3/OSS)
      GATEWAY_STORAGE__BACKEND: "${STORAGE_BACKEND:-s3}"
      GATEWAY_STORAGE__S3__BUCKET: "${S3_BUCKET:-}"
      GATEWAY_STORAGE__S3__REGION: "${S3_REGION:-us-east-1}"
      GATEWAY_STORAGE__S3__ACCESS_KEY: "${S3_ACCESS_KEY:-}"
      GATEWAY_STORAGE__S3__SECRET_KEY: "${S3_SECRET_KEY:-}"
      GATEWAY_STORAGE__S3__ENDPOINT_URL: "${S3_ENDPOINT_URL:-}"
      GATEWAY_STORAGE__URL_EXPIRY_SECONDS: "${STORAGE_URL_EXPIRY_SECONDS:-3600}"
      GATEWAY_STORAGE__KEY_PREFIX: "${STORAGE_KEY_PREFIX:-dev}"

      # File Upload Limits
      MAX_FILE_SIZE_MB: "${MAX_FILE_SIZE_MB:-50}"
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    volumes:
      - gateway-logs:/app/logs
    networks:
      - ai-gateway-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # AI Gateway Frontend (Web Console)
  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
        VITE_API_BASE_URL: ""
    image: ai-gateway-web:${TAG:-latest}
    container_name: ai-gateway-frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - ai-gateway-net
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # ===========================================================================
  # Microservices
  # ===========================================================================

  # Knowledge Base Service (KB CRUD + Retrieval)
  knowledge-service:
    build:
      # Build from repo root so the Dockerfile can COPY packages/
      # (shared ai-gateway-core). Matches the assistant-service pattern.
      context: .
      dockerfile: apps/knowledge-service/Dockerfile
    image: knowledge-service:${TAG:-latest}
    container_name: ai-gateway-knowledge
    environment:
      KNOWLEDGE_CORS__ALLOW_ORIGINS: "${CORS_ALLOW_ORIGINS:-http://localhost:80,http://localhost:3000}"
      KNOWLEDGE_APP__HOST: "0.0.0.0"
      KNOWLEDGE_APP__PORT: "8092"
      KNOWLEDGE_DATABASE__DSN: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-gateway}"
      KNOWLEDGE_REDIS__ENABLED: "true"
      KNOWLEDGE_REDIS__URL: "redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/2"
      KNOWLEDGE_QDRANT__URL: "http://qdrant:6333"
      KNOWLEDGE_EMBEDDINGS__PROVIDER: "${KB_EMBEDDING_PROVIDER:-gemini}"
      KNOWLEDGE_EMBEDDINGS__API_KEY: "${KB_EMBEDDING_API_KEY:-}"
      KNOWLEDGE_EMBEDDINGS__MODEL: "gemini-embedding-2-preview"
      KNOWLEDGE_EMBEDDINGS__DIMENSION: "1024"
      KNOWLEDGE_PROCESSING__WORKER_CONCURRENCY: "${KB_WORKER_CONCURRENCY:-2}"
      # Storage (S3)
      KNOWLEDGE_STORAGE__BACKEND: "${GATEWAY_STORAGE__BACKEND:-s3}"
      KNOWLEDGE_STORAGE__S3__BUCKET: "${GATEWAY_STORAGE__S3__BUCKET:-}"
      KNOWLEDGE_STORAGE__S3__REGION: "${GATEWAY_STORAGE__S3__REGION:-ap-southeast-2}"
      KNOWLEDGE_STORAGE__S3__ACCESS_KEY: "${GATEWAY_STORAGE__S3__ACCESS_KEY:-}"
      KNOWLEDGE_STORAGE__S3__SECRET_KEY: "${GATEWAY_STORAGE__S3__SECRET_KEY:-}"
      KNOWLEDGE_STORAGE__S3__ENDPOINT_URL: "${GATEWAY_STORAGE__S3__ENDPOINT_URL:-}"
      KNOWLEDGE_STORAGE__KEY_PREFIX: "${GATEWAY_STORAGE__KEY_PREFIX:-dev}"
      # Phase K5c: gateway HMAC verification (Polaris #6-KB). Same secret as
      # assistant-service — single shared value across both gateway hops.
      GATEWAY_ASSISTANT_SHARED_SECRET: "${GATEWAY_ASSISTANT_SHARED_SECRET:?GATEWAY_ASSISTANT_SHARED_SECRET is required for knowledge-service HMAC auth}"
    command: ["python", "-m", "uvicorn", "knowledge_service.main:app", "--host", "0.0.0.0", "--port", "8092", "--workers", "3"]
    volumes:
      - kb-data:/app/data
      - ./apps/knowledge-service/src/knowledge_service:/usr/local/lib/python3.12/site-packages/knowledge_service
    ports:
      - "127.0.0.1:${KNOWLEDGE_SERVICE_PORT:-8092}:8092"
    networks:
      - ai-gateway-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8092/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # Islamic Content Service (Quran / Dua / Hadith)
  islamic-content:
    build:
      context: ./apps/islamic-content-service
      dockerfile: Dockerfile
    image: islamic-content-service:${TAG:-latest}
    container_name: islamic-content-service
    environment:
      ISLAMIC_CONTENT_APP__HOST: "0.0.0.0"
      ISLAMIC_CONTENT_APP__PORT: "8091"
      ISLAMIC_CONTENT_DATABASE__DSN: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-gateway}"
      ISLAMIC_CONTENT_DATABASE__SCHEMA: "${ISLAMIC_CONTENT_SCHEMA:-islamic_content}"
      ISLAMIC_CONTENT_DATABASE__AUTO_MIGRATE: "true"
      ISLAMIC_CONTENT_CACHE__REDIS_URL: "redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/1"
      ISLAMIC_CONTENT_BOOTSTRAP__ON_START: "true"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GATEWAY_URL: "http://gateway:8080"
    ports:
      - "127.0.0.1:${ISLAMIC_CONTENT_PORT:-8091}:8091"
    networks:
      - ai-gateway-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8091/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # ===========================================================================
  # Assistant Service (Phase 3 — extracted microservice, disabled by default)
  # To activate: uncomment below + set ASSISTANT_MODE=remote on gateway service.
  # ===========================================================================
  assistant-service:
    build:
      context: .
      dockerfile: apps/assistant-service/Dockerfile
    container_name: assistant-service
    image: assistant-service:${TAG:-latest}
    # Phase 5a: ``expose`` makes port 8093 reachable only on the docker
    # bridge network (other compose services). Public access is not
    # published to the host. See audit Finding H-4 + GATE G5a-6.
    expose:
      - "8093"
    environment:
      ASSISTANT_CORS__ALLOW_ORIGINS: "${CORS_ALLOW_ORIGINS:-http://localhost:80,http://localhost:3000}"
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/gateway
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
      KB_SERVICE_URL: http://knowledge-service:8092
      # Must be ``false`` in prod. When set to ``true`` (dev only) the
      # gateway-secret middleware lets requests without an HMAC header
      # through; get_user_context still demands X-User-Id/X-Tenant-Id.
      ASSISTANT_APP__ALLOW_ANONYMOUS: "${ASSISTANT_APP__ALLOW_ANONYMOUS:-false}"
      # Shared HMAC for gateway↔assistant-service. Both services MUST
      # have the same value; a mismatch yields 401 at the middleware.
      GATEWAY_ASSISTANT_SHARED_SECRET: "${GATEWAY_ASSISTANT_SHARED_SECRET:?GATEWAY_ASSISTANT_SHARED_SECRET is required for gateway<->assistant-service auth}"
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      DASHSCOPE_CHAT_API_KEY: ${DASHSCOPE_CHAT_API_KEY:-}
      DASHSCOPE_CHAT_BASE_URL: ${DASHSCOPE_CHAT_BASE_URL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GOOGLE_API_BACKEND: ${GOOGLE_API_BACKEND:-}
      VERTEX_API_KEY: ${VERTEX_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
    networks:
      - ai-gateway-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8093/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # mcp-docgen-server
  # Exposes a single ``generate_document`` MCP tool (docx / pptx / xlsx / pdf).
  # Kept as a separate container so its heavy deps (LibreOffice, CJK fonts,
  # poppler) don't bloat the gateway image. Reachable only on the internal
  # network — the gateway's MCPClient connects via http://mcp-docgen-server:8765.
  mcp-docgen-server:
    build:
      context: .
      dockerfile: packages/mcp-docgen-server/Dockerfile
    container_name: mcp-docgen-server
    image: mcp-docgen-server:${TAG:-latest}
    environment:
      MCP_TRANSPORT: http
      PORT: "8765"
      LOG_LEVEL: INFO
      DOCGEN_ARTIFACT_ROOT: /var/lib/docgen/artifacts
      # Signed-URL base must match the **public** host the browser will
      # call, since we want users to be able to click the returned
      # download_url. Signatures are path-only (see docgen/storage/signing.py)
      # so the internal vs public host mismatch at verify time is fine.
      DOCGEN_PUBLIC_URL: ${DOCGEN_PUBLIC_URL:-http://mcp-docgen-server.internal:8765}
      # Fed into docgen's planner — without it the pipeline falls back to
      # a near-empty deterministic template and every deck/doc/sheet is a
      # skeleton. See 2026-04-22 incident.
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      DOCGEN_LLM_MODEL: ${DOCGEN_LLM_MODEL:-}
      DOCGEN_ARTIFACT_SIGN_KEY: ${DOCGEN_ARTIFACT_SIGN_KEY:-}
    ports:
      # Bind to loopback only — nginx on the host proxies public
      # ``/docgen/artifacts/*`` requests here so users can actually
      # download the signed URLs. Container-to-container traffic still
      # uses the ``mcp-docgen-server.internal`` network alias.
      - "127.0.0.1:8765:8765"
    volumes:
      - docgen-artifacts:/var/lib/docgen/artifacts
    networks:
      ai-gateway-net:
        # ``.internal`` alias lets the gateway's MCPClient SSRF guard treat
        # the hostname as a trusted docker-internal name and allow http://.
        aliases:
          - mcp-docgen-server.internal
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8765/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

# =============================================================================
# Networks
# =============================================================================
networks:
  ai-gateway-net:
    driver: bridge
    name: ai-gateway-network

# =============================================================================
# Volumes
# =============================================================================
volumes:
  pg-data:
    name: ai-gateway-pg-data
  redis-data:
    name: ai-gateway-redis-data
  qdrant-data:
    name: ai-gateway-qdrant-data
  gateway-logs:
    name: ai-gateway-logs
  kb-data:
    name: ai-gateway-kb-data
  docgen-artifacts:
    name: ai-gateway-docgen-artifacts
  tempo-data:
    name: ai-gateway-tempo-data
