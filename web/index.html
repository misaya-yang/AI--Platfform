<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>web</title>
    <!-- Inter font for better English typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <!-- Emergency reset script: runs BEFORE any modules load -->
    <script>
      (function() {
        var params = new URLSearchParams(window.location.search);
        if (params.get("reset") === "true") {
          console.log("[Emergency Reset] Clearing localStorage before React loads");
          localStorage.removeItem("agent-gateway-storage");
          var newUrl = window.location.pathname;
          window.history.replaceState({}, "", newUrl);
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
