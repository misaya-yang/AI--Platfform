# Development override for editing backend services without rebuilding images.
#
# Usage after the first image build:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml --env-file .env up -d gateway assistant-service knowledge-service
#
# The base compose file remains the production-like quickstart. This override
# bind-mounts source and runs uvicorn with --reload for local iteration.

services:
  gateway:
    command:
      ["python", "-m", "uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8080", "--reload"]
    volumes:
      - ./src:/app/src
      - ./database:/app/database
      - ./config:/app/config
      - ./packages/ai-gateway-core/src/ai_gateway_core:/opt/venv/lib/python3.12/site-packages/ai_gateway_core

  assistant-service:
    command:
      ["uvicorn", "assistant_service.main:app", "--host", "0.0.0.0", "--port", "8093", "--reload", "--timeout-keep-alive", "120"]
    volumes:
      - ./apps/assistant-service/src:/app/apps/assistant-service/src
      - ./packages/ai-gateway-core/src/ai_gateway_core:/opt/venv/lib/python3.12/site-packages/ai_gateway_core

  knowledge-service:
    command:
      ["python", "-m", "uvicorn", "knowledge_service.main:app", "--host", "0.0.0.0", "--port", "8092", "--reload"]
    volumes:
      - ./packages/ai-gateway-core/src/ai_gateway_core:/usr/local/lib/python3.12/site-packages/ai_gateway_core
