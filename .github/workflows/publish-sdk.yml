name: Publish SDKs

on:
  push:
    tags:
      - 'sdk-v*'  # Trigger on tags like sdk-v1.0.2

jobs:
  verify-sse-contract:
    name: Verify shared SDK SSE contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        run: python -m pip install uv
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Install Maven
        run: sudo apt-get update && sudo apt-get install --yes maven
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Install CLI dependencies
        run: npm --prefix sdk/cli ci
      - name: Run shared SSE contract
        env:
          SDK_SSE_CONTRACT_REQUIRE_ALL: '1'
        run: make sdk-sse-contract

  publish-pypi:
    name: Publish Python SDK to PyPI
    needs: verify-sse-contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build
        run: |
          cd sdk/python
          pip install build twine
          python -m build
      - name: Upload to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: cd sdk/python && twine upload dist/*

  publish-cli:
    name: Publish ai-gateway-cli to npm
    needs: verify-sse-contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: Install & Build
        run: |
          cd sdk/cli
          npm ci
          npm run build
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd sdk/cli
          npm publish --access public
