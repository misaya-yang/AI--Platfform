# =============================================================================
# Docker Build & Push to GHCR
# =============================================================================
# Triggers on version tags (v*). Builds and pushes three images:
#   - ghcr.io/<owner>/ai-gateway
#   - ghcr.io/<owner>/ai-gateway-web
#   - ghcr.io/<owner>/islamic-content-service
# =============================================================================

name: Docker Publish

on:
  push:
    tags:
      - "v*"

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: ai-gateway
            context: .
            dockerfile: Dockerfile
          - image: ai-gateway-web
            context: ./web
            dockerfile: ./web/Dockerfile
          - image: islamic-content-service
            context: ./apps/islamic-content-service
            dockerfile: ./apps/islamic-content-service/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
