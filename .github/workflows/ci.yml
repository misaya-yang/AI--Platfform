name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.11.19"

jobs:
  script-contracts:
    name: Script Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install "uv==${UV_VERSION}"

      - name: Verify Knowledge Service image lock
        run: make kb-image-lock-gate

      - name: Check shell script syntax
        run: |
          bash -n scripts/new/validate-env.sh
          bash -n scripts/new/seed-demo-data.sh

      - name: Run focused Python lint
        run: |
          uv run --extra dev ruff check \
            tests/scripts/test_validate_env_quickstart.py \
            tests/scripts/test_web_runtime_config_entrypoint.py \
            tests/scripts/test_seed_demo_data.py

      - name: Run focused script tests
        run: |
          uv run --extra dev --extra test pytest -q --no-cov \
            tests/scripts/test_validate_env_quickstart.py \
            tests/scripts/test_web_runtime_config_entrypoint.py \
            tests/scripts/test_seed_demo_data.py

  compose-and-harness:
    name: Compose and Harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify harness contract
        run: make harness-check

      - name: Validate public example config
        run: make validate-example-config

      - name: Validate compose config
        run: docker compose --env-file .env.example config --quiet

      - name: Check deploy script syntax
        run: |
          bash -n scripts/new/doctor.sh
          bash -n scripts/new/deploy.sh
          bash -n scripts/new/init-env.sh
          bash -n scripts/new/status.sh

  frontend:
    name: Frontend Typecheck, Lint, Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate

      - name: Install frontend dependencies
        run: pnpm -C web install --frozen-lockfile

      - name: Typecheck
        run: pnpm -C web type-check

      - name: Lint
        run: pnpm -C web lint

      - name: Build
        run: pnpm -C web build

      - name: i18n keys
        run: pnpm -C web i18n:check

      - name: Install Playwright browser
        run: pnpm -C web exec playwright install --with-deps chromium

      - name: Open-source route smoke
        run: pnpm -C web e2e:opensource

  eval-regression-gate:
    name: Eval Contract Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install "uv==${UV_VERSION}"

      - name: Run deterministic Agent and RAG Eval E1 fixture contracts
        run: make eval-e1-gate

      - name: Upload Eval E1 contract reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-e1-contract-reports
          path: |
            tmp/eval-regression/latest.json
            tmp/eval-regression/latest.md
            tmp/eval-e1/rag-latest.json
          if-no-files-found: warn

      - name: Run Agent Eval core gate
        run: make agent-eval-core-gate

      - name: Run Knowledge Base unit gate
        run: make kb-unit-gate

      - name: Run Knowledge Base development-fixture structure gate
        run: make kb-golden-gate

      - name: Run gateway KB boundary gate
        run: make gateway-kb-boundary-gate

      - name: Run eval supporting unit tests
        run: |
          uv run --all-packages --extra test pytest -q --no-cov \
            tests/services/eval/test_online_sampling.py \
            tests/services/eval/test_outbox_worker.py
          python3 scripts/harness/runtime_dependency_gate.py

  kb-migration-gate:
    name: KB Migration Gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-postgres
          POSTGRES_DB: kb_migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kb_migration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install "uv==${UV_VERSION}"

      - name: Install PostgreSQL dump/restore client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      # tests/database helpers read POSTGRES_* from the repo-root .env via
      # dotenv_values and connect to 127.0.0.1 — point that file at the
      # throwaway service container (port-mapped to the runner host).
      - name: Point local test config at the CI Postgres service
        run: |
          cat > .env <<'EOF'
          POSTGRES_HOST=127.0.0.1
          POSTGRES_PORT=5432
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=ci-postgres
          POSTGRES_DB=kb_migration_test
          EOF

      - name: Run KB migration gate
        run: make kb-migration-gate

  release-ready:
    name: Release Readiness
    runs-on: ubuntu-latest
    needs: [script-contracts, compose-and-harness, frontend, eval-regression-gate, kb-migration-gate]
    steps:
      - uses: actions/checkout@v4

      - name: Verify public release docs
        run: |
          test -s LICENSE
          test -s CONTRIBUTING.md
          test -s SECURITY.md
          test -s CODE_OF_CONDUCT.md
          test -s SUPPORT.md
          test -s RELEASE.md
          test -s deploy/runbooks/open-source-env-readiness-todo.md

      - name: Verify demo seed dry run
        run: scripts/new/seed-demo-data.sh --dry-run
