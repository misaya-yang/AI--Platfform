name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  script-contracts:
    name: Script Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv

      - name: Check shell script syntax
        run: |
          bash -n scripts/new/validate-env.sh
          bash -n scripts/new/seed-demo-data.sh

      - name: Run focused Python lint
        run: |
          uv run ruff check \
            tests/scripts/test_validate_env_quickstart.py \
            tests/scripts/test_web_runtime_config_entrypoint.py \
            tests/scripts/test_seed_demo_data.py

      - name: Run focused script tests
        run: |
          uv run --extra dev --extra test pytest -q --no-cov \
            tests/scripts/test_validate_env_quickstart.py \
            tests/scripts/test_web_runtime_config_entrypoint.py \
            tests/scripts/test_seed_demo_data.py

  compose-and-harness:
    name: Compose and Harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate public example config
        run: make validate-example-config

      - name: Validate compose config
        run: docker compose --env-file .env.example config --quiet

      - name: Verify tracked release runbook
        run: |
          test -s deploy/runbooks/open-source-env-readiness-todo.md

  frontend:
    name: Frontend Typecheck, Lint, Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate

      - name: Install frontend dependencies
        run: pnpm -C web install --frozen-lockfile

      - name: Typecheck
        run: pnpm -C web type-check

      - name: Lint
        run: pnpm -C web lint

      - name: Build
        run: pnpm -C web build

      - name: Install Playwright browser
        run: pnpm -C web exec playwright install --with-deps chromium

      - name: Open-source route smoke
        run: pnpm -C web e2e:opensource

  eval-regression-gate:
    name: Eval Contract Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv

      - name: Run deterministic Agent and RAG Eval E1 fixture contracts
        run: make eval-e1-gate

      - name: Upload Eval E1 contract reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-e1-contract-reports
          path: |
            tmp/eval-regression/latest.json
            tmp/eval-regression/latest.md
            tmp/eval-e1/rag-latest.json
          if-no-files-found: warn

      - name: Run Agent Eval core gate
        run: make agent-eval-core-gate

      - name: Run eval supporting unit tests
        run: |
          uv run --all-packages --extra test pytest -q --no-cov \
            tests/services/eval/test_online_sampling.py \
            tests/services/eval/test_outbox_worker.py

  release-ready:
    name: Release Readiness
    runs-on: ubuntu-latest
    needs: [script-contracts, compose-and-harness, frontend, eval-regression-gate]
    steps:
      - uses: actions/checkout@v4

      - name: Verify public release docs
        run: |
          test -s LICENSE
          test -s CONTRIBUTING.md
          test -s SECURITY.md
          test -s CODE_OF_CONDUCT.md
          test -s SUPPORT.md
          test -s RELEASE.md
          test -s deploy/runbooks/open-source-env-readiness-todo.md

      - name: Verify demo seed dry run
        run: scripts/new/seed-demo-data.sh --dry-run
